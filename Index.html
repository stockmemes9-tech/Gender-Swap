<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gender Swap Cam</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f4fb;--fg:#1d1a2b;--card:#fff;--accent:#7c4dff;--mut:#6b6880;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--fg:#f1eefc;--card:#1e1b2e;--accent:#a58bff;--mut:#9b97b3}}
:root[data-theme="dark"]{--bg:#14121f;--fg:#f1eefc;--card:#1e1b2e;--accent:#a58bff;--mut:#9b97b3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:1.4rem;margin:4px 0}
p.sub{margin:0 0 12px;color:var(--mut);font-size:.9rem;text-align:center;max-width:560px}
.stage{position:relative;width:100%;max-width:640px;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3;touch-action:none}
canvas{width:100%;height:100%;display:block}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ddd;text-align:center;padding:20px;font-size:.95rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;max-width:640px}
button{border:0;border-radius:999px;padding:10px 16px;font-size:.95rem;background:var(--card);color:var(--fg);cursor:pointer;box-shadow:0 1px 3px #0003}
button.on,button.main{background:var(--accent);color:#fff}
.row{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.85rem;color:var(--mut)}
#msg{margin-top:10px;font-size:.85rem;color:var(--mut);text-align:center;max-width:560px;min-height:1.2em}
</style>
</head>
<body>
<h1>Gender Swap Cam</h1>
<p class="sub">Live camera filter that restyles faces with feminine or masculine features. Everything runs in your browser; no video leaves your device.</p>
<div class="stage"><canvas id="c" width="640" height="480"></canvas><div class="ph" id="ph">Tap “Start camera” to begin</div></div>
<div class="bar">
  <button class="main" id="start">Start camera</button>
  <button id="fem">Feminine</button>
  <button id="masc">Masculine</button>
  <button id="off">Original</button>
  <button id="snap">Snapshot</button>
</div>
<div class="row" id="manual" style="display:none"><span>Face size</span><input type="range" id="size" min="80" max="400" value="200"><span>drag on the video to position</span></div>
<div id="msg"></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),vid=document.createElement('video');
vid.playsInline=true;vid.muted=true;
let mode='fem',running=false,faces=[],detector=null,manual={x:320,y:230,w:200,h:260},lastDet=0,hairCol='#4a2c1a';
const $=id=>document.getElementById(id),msg=t=>$('msg').textContent=t||'';
const dots=[];let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
while(dots.length<600){const u=rnd()*2-1,v=rnd();if(u*u+v*v<1)dots.push([u,v,rnd()*1.6+.6])}
try{if('FaceDetector' in window)detector=new FaceDetector({fastMode:true,maxDetectedFaces:6})}catch(e){}
function setMode(m){mode=m;['fem','masc','off'].forEach(k=>$(k).classList.toggle('on',k===m))}
setMode('fem');
$('fem').onclick=()=>setMode('fem');$('masc').onclick=()=>setMode('masc');$('off').onclick=()=>setMode('off');
$('start').onclick=async()=>{
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});
    vid.srcObject=st;await vid.play();
    cv.width=vid.videoWidth||640;cv.height=vid.videoHeight||480;
    manual={x:cv.width/2,y:cv.height*.48,w:cv.height*.4,h:cv.height*.52};
    $('ph').style.display='none';$('start').style.display='none';running=true;
    if(!detector){$('manual').style.display='flex';msg('Your browser has no built-in face detection, so place the filter on your face manually.')}
    loop();
  }catch(e){msg('Camera unavailable: '+e.message+'. If this page is embedded, open it in its own tab and allow camera access.')}
};
$('size').oninput=e=>{const w=+e.target.value;manual.w=w;manual.h=w*1.3};
let drag=false;
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cv.onpointerdown=e=>{drag=true;[manual.x,manual.y]=pos(e)};
cv.onpointermove=e=>{if(drag)[manual.x,manual.y]=pos(e)};
window.onpointerup=()=>drag=false;
$('snap').onclick=()=>{if(!running)return;const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='gender-swap.png';a.click()};

async function detect(){
  if(!detector||performance.now()-lastDet<120)return;lastDet=performance.now();
  try{const r=await detector.detect(vid);
    faces=r.map(f=>{const b=f.boundingBox,W=cv.width;
      const o={x:W-(b.x+b.width),y:b.y,w:b.width,h:b.height*1.1};
      (f.landmarks||[]).forEach(l=>{const p=l.locations[0];const q={x:W-p.x,y:p.y};
        if(l.type==='mouth')o.mouth=q;else if(l.type==='eye'){(o.eyes=o.eyes||[]).push(q)}});
      return o});
  }catch(e){detector=null;$('manual').style.display='flex';msg('Face detection failed; using manual placement.')}
}
function geom(f){
  const eyes=f.eyes&&f.eyes.length>=2?f.eyes:[{x:f.x+f.w*.3,y:f.y+f.h*.4},{x:f.x+f.w*.7,y:f.y+f.h*.4}];
  const mouth=f.mouth||{x:f.x+f.w/2,y:f.y+f.h*.76};
  return{eyes,mouth};
}
function fem(f){
  const{x,y,w,h}=f,cx=x+w/2,{eyes,mouth}=geom(f);
  // skin smoothing
  ctx.save();ctx.beginPath();ctx.ellipse(cx,y+h*.55,w*.5,h*.5,0,0,7);ctx.clip();
  try{ctx.filter='blur('+Math.max(2,w/45)+'px) brightness(1.06)';ctx.globalAlpha=.6;ctx.drawImage(cv,0,0)}catch(e){}
  ctx.restore();ctx.filter='none';ctx.globalAlpha=1;
  // blush
  [-.28,.28].forEach(d=>{const g=ctx.createRadialGradient(cx+d*w*1.1,y+h*.65,0,cx+d*w*1.1,y+h*.65,w*.2);
    g.addColorStop(0,'rgba(255,100,130,.4)');g.addColorStop(1,'rgba(255,100,130,0)');ctx.fillStyle=g;ctx.fillRect(x,y,w,h*1.2)});
  // lips
  const mw=w*.2;ctx.fillStyle='rgba(205,40,75,.8)';ctx.beginPath();
  ctx.moveTo(mouth.x-mw,mouth.y);ctx.quadraticCurveTo(mouth.x-mw/2,mouth.y-h*.07,mouth.x,mouth.y-h*.03);
  ctx.quadraticCurveTo(mouth.x+mw/2,mouth.y-h*.07,mouth.x+mw,mouth.y);
  ctx.quadraticCurveTo(mouth.x,mouth.y+h*.08,mouth.x-mw,mouth.y);ctx.fill();
  // lashes + liner
  ctx.strokeStyle='rgba(20,10,10,.85)';ctx.lineCap='round';
  eyes.forEach(e=>{const r=w*.12;ctx.lineWidth=Math.max(2,w/50);ctx.beginPath();ctx.arc(e.x,e.y,r,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
    ctx.lineWidth=Math.max(1,w/90);for(let i=0;i<5;i++){const a=Math.PI*(1.15+i*.17);
      ctx.beginPath();ctx.moveTo(e.x+Math.cos(a)*r,e.y+Math.sin(a)*r);ctx.lineTo(e.x+Math.cos(a)*r*1.4,e.y+Math.sin(a)*r*1.5);ctx.stroke()}});
  // thin arched brows
  ctx.lineWidth=Math.max(1.5,w/70);ctx.strokeStyle=hairCol;
  eyes.forEach(e=>{ctx.beginPath();ctx.moveTo(e.x-w*.12,e.y-h*.1);ctx.quadraticCurveTo(e.x,e.y-h*.17,e.x+w*.12,e.y-h*.1);ctx.stroke()});
  // long hair
  const g=ctx.createLinearGradient(0,y-h*.3,0,y+h*1.6);g.addColorStop(0,hairCol);g.addColorStop(1,'#2a160c');
  ctx.fillStyle=g;ctx.globalAlpha=.93;ctx.beginPath();
  ctx.moveTo(x-w*.1,y+h*.3);ctx.bezierCurveTo(x-w*.1,y-h*.4,x+w*1.1,y-h*.4,x+w*1.1,y+h*.3);
  ctx.bezierCurveTo(x+w*1.3,y+h*.9,x+w*1.35,y+h*1.4,x+w*1.2,y+h*1.65);
  ctx.lineTo(x+w*.92,y+h*1.5);ctx.bezierCurveTo(x+w*1,y+h*1,x+w*.98,y+h*.6,x+w*.9,y+h*.28);
  ctx.quadraticCurveTo(cx+w*.15,y-h*.02,x+w*.1,y+h*.3);
  ctx.bezierCurveTo(x+w*.02,y+h*.6,x,y+h,x+w*.08,y+h*1.5);
  ctx.lineTo(x-w*.2,y+h*1.65);ctx.bezierCurveTo(x-w*.35,y+h*1.4,x-w*.3,y+h*.9,x-w*.1,y+h*.3);ctx.fill();
  ctx.globalAlpha=1;
}
function masc(f){
  const{x,y,w,h}=f,cx=x+w/2,{eyes}=geom(f);
  // jaw shadow / contrast
  ctx.save();ctx.beginPath();ctx.ellipse(cx,y+h*.55,w*.5,h*.5,0,0,7);ctx.clip();
  const sh=ctx.createLinearGradient(0,y+h*.5,0,y+h);sh.addColorStop(0,'rgba(60,40,30,0)');sh.addColorStop(1,'rgba(60,40,30,.28)');
  ctx.fillStyle=sh;ctx.fillRect(x,y,w,h*1.1);
  // stubble
  ctx.fillStyle='rgba(30,22,18,.55)';
  dots.forEach(([u,v,r])=>{const px=cx+u*w*.46,py=y+h*.58+v*h*.4;
    if(py>y+h*.88&&Math.abs(px-cx)<w*.13&&py<y+h*.93)return;
    ctx.beginPath();ctx.arc(px,py,Math.max(.7,w/160)*r,0,7);ctx.fill()});
  ctx.restore();
  // thick brows
  ctx.strokeStyle='rgba(25,15,10,.9)';ctx.lineCap='round';ctx.lineWidth=Math.max(3,w/28);
  eyes.forEach(e=>{ctx.beginPath();ctx.moveTo(e.x-w*.13,e.y-h*.085);ctx.lineTo(e.x+w*.13,e.y-h*.1);ctx.stroke()});
  // short hair
  ctx.fillStyle='#1f1812';ctx.beginPath();
  ctx.moveTo(x-w*.02,y+h*.38);ctx.bezierCurveTo(x-w*.12,y-h*.15,x+w*.2,y-h*.3,cx,y-h*.28);
  ctx.bezierCurveTo(x+w*.8,y-h*.3,x+w*1.12,y-h*.15,x+w*1.02,y+h*.38);
  ctx.lineTo(x+w*.95,y+h*.42);ctx.lineTo(x+w*.9,y+h*.22);
  ctx.quadraticCurveTo(cx,y+h*.02,x+w*.1,y+h*.22);ctx.lineTo(x+w*.05,y+h*.42);ctx.closePath();ctx.fill();
}
function loop(){
  if(!running)return;
  ctx.save();ctx.scale(-1,1);ctx.drawImage(vid,-cv.width,0,cv.width,cv.height);ctx.restore();
  if(mode!=='off'){
    detect();
    const list=detector?faces:[{x:manual.x-manual.w/2,y:manual.y-manual.h/2,w:manual.w,h:manual.h}];
    list.forEach(f=>mode==='fem'?fem(f):masc(f));
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
